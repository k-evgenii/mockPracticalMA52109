[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster_maker"
version = "0.1.0"
description = "Educational clustering package for MA52109 practical"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cluster_maker", "cluster_maker.*"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
